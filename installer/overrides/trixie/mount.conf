---
# Trixie / Calamares 3.3: options listedir, EFI öğesi efi: true ile işaretlenir.
# İşlev bookworm ile aynıdır; 3.2 biçimini burada kullanma (b,i,n,d olur).
extraMounts:
  - device: /dev
    mountPoint: /dev
    options: [bind]
  - device: /dev/pts
    mountPoint: /dev/pts
    options: [bind]
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [bind]
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true
