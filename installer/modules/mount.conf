---
# Bookworm / Calamares 3.2: options metindir, EFI bağlantıları ayrı listededir.
# Bu dosya yoksa Calamares /dev vb. bağlantıları varsaymaz; yalnızca uyarır.
# unpackfs bu listeyi kopyalama DIŞLAMASI olarak da kullanır.
extraMounts:
  - device: /dev
    mountPoint: /dev
    options: bind
  - device: /dev/pts
    mountPoint: /dev/pts
    options: bind
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: bind
  - device: sys
    fs: sysfs
    mountPoint: /sys
extraMountsEfi:
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
