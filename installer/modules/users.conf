---
defaultGroups: [sudo, audio, video, plugdev, netdev, cdrom, lpadmin, bluetooth]
autologinGroup: ""
doAutologin: false
sudoersGroup: ""
setRootPassword: false
doReusePassword: false
allowWeakPasswords: false
allowWeakPasswordsDefault: false
passwordRequirements:
  nonempty: true
  minLength: 8
user:
  shell: /bin/bash
  forbidden_names: [root, nobody, oguz]
userShell: /bin/bash
hostname:
  location: EtcFile
  writeHostsFile: true
  template: oguzdows
  forbidden_names: [localhost]
setHostname: EtcFile
writeHostsFile: true
