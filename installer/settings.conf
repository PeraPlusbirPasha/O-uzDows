---
# Özel boot işi /etc altında, dağıtımın diğer modülleri standart yerinde kalır.
modules-search: [/etc/calamares/modules, local]
branding: oguzdows
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: false
# Sonuç ekranını kullanıcı kapatmalı; kurucu kendiliğinden başlatıcıya dönmesin.
quit-at-end: false
instances:
  - id: cleanup
    module: shellprocess
    config: cleanup.conf
  - id: drivers
    module: oguzdowsdrivers
    config: selected-drivers.conf
  - id: mount-verify
    module: oguzdowsmount
    config: mount-verify.conf
  - id: mount-probe
    module: oguzdowsmount
    config: mount-probe.conf
  - id: boot-prepare
    module: oguzdowsboot
    config: boot-prepare.conf
  - id: boot-verify
    module: oguzdowsboot
    config: boot-verify.conf
  - id: target-prepare
    module: oguzdowstarget
    config: target-prepare.conf
  - id: target-verify
    module: oguzdowstarget
    config: target-verify.conf
  - id: target-menu
    module: oguzdowstarget
    config: target-menu.conf
  - id: result-start
    module: oguzdowsresult
    config: result-start.conf
  - id: result-files
    module: oguzdowsresult
    config: result-files.conf
  - id: result-boot
    module: oguzdowsresult
    config: result-boot.conf
  - id: result-complete
    module: oguzdowsresult
    config: result-complete.conf
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - oguzdowsresult@result-start
      - partition
      - mount
      - oguzdowsmount@mount-verify
      - oguzdowsresult@result-files
      - unpackfs
      - removeuser
      - shellprocess@cleanup
      - machineid
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - fstab
      - initramfscfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - packages
      - oguzdowsdrivers@drivers
      - oguzdowsresult@result-boot
      - grubcfg
      - oguzdowstarget@target-prepare
      - initramfs
      - oguzdowstarget@target-verify
      - oguzdowsboot@boot-prepare
      - oguzdowsmount@mount-probe
      - bootloader
      - oguzdowsboot@boot-verify
      - oguzdowstarget@target-menu
      - umount
      - oguzdowsresult@result-complete
  - show:
      - finished
