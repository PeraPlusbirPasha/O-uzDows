---
modules-search: [local]
branding: oguzdows
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: false
quit-at-end: true
instances:
  - id: cleanup
    module: shellprocess
    config: cleanup.conf
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - removeuser
      - shellprocess@cleanup
      - machineid
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - fstab
      - initramfscfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - packages
      - grubcfg
      - initramfs
      - bootloader
      - umount
  - show:
      - finished
